name: Coolify deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coolify-report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Coolify reporter App token
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-deployments: write
      - name: Report actual Coolify deployments
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: python scripts/report_coolify_deployments.py
