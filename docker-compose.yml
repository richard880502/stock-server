services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - quote_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Ingest: the only writer of market data (official sync + Shioaji collector when
  # QUOTES_ENABLED=true and credentials are set).
  quotes:
    build:
      context: .
      dockerfile: deploy/quotes/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/livez', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 3
    environment:
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant_signal
      QUOTES_ENABLED: ${QUOTES_ENABLED:-false}
      QUOTES_REDIS_URL: redis://redis:6379/0
      QUOTES_MAX_SYMBOLS: ${QUOTES_MAX_SYMBOLS:-200}
      SHIOAJI_API_KEY: ${SHIOAJI_API_KEY:-}
      SHIOAJI_SECRET_KEY: ${SHIOAJI_SECRET_KEY:-}
      SHIOAJI_SIMULATION: ${SHIOAJI_SIMULATION:-false}
      QUOTES_BACKFILL_ENABLED: ${QUOTES_BACKFILL_ENABLED:-true}
      QUOTES_BACKFILL_AFTER_CLOSE: "${QUOTES_BACKFILL_AFTER_CLOSE:-14:35}"
      QUOTES_BACKFILL_INTRADAY_MAX: ${QUOTES_BACKFILL_INTRADAY_MAX:-150}
      QUOTES_BACKFILL_WHOLE_MARKET: ${QUOTES_BACKFILL_WHOLE_MARKET:-true}
      QUOTES_BACKFILL_MAX_SYMBOLS: ${QUOTES_BACKFILL_MAX_SYMBOLS:-2500}
      QUOTES_USAGE_RESERVE_MB: ${QUOTES_USAGE_RESERVE_MB:-100}
      QUOTES_SNAPSHOT_MINUTES: ${QUOTES_SNAPSHOT_MINUTES:-10}
      MINUTE_BARS_RETENTION_MONTHS: ${MINUTE_BARS_RETENTION_MONTHS:-0}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_DAILY_TIME: ${SYNC_DAILY_TIME:-15:30,21:45}
      SYNC_MARKET_LOOKBACK_DAYS: ${SYNC_MARKET_LOOKBACK_DAYS:-520}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-500}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quant_signal
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
    ports:
      - "15432:5432"
    volumes:
      - quant_signal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_signal"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://quant:quant@postgres:5432/quant_signal
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_TRANSPORT: streamable-http
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000,http://127.0.0.1:13000}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-false}
      QUOTES_ENABLED: ${QUOTES_ENABLED:-false}
      QUOTES_REDIS_URL: redis://redis:6379/0
      QUOTES_MAX_SYMBOLS: ${QUOTES_MAX_SYMBOLS:-200}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_API_KEY: ${LLM_API_KEY:-local}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1800}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      JUDGE_LLM_ENABLED: ${JUDGE_LLM_ENABLED:-false}
      JUDGE_LLM_BASE_URL: ${JUDGE_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      JUDGE_LLM_MODEL: ${JUDGE_LLM_MODEL:-}
      JUDGE_LLM_API_KEY: ${JUDGE_LLM_API_KEY:-local}
      JUDGE_LLM_TEMPERATURE: ${JUDGE_LLM_TEMPERATURE:-0.2}
      JUDGE_LLM_MAX_TOKENS: ${JUDGE_LLM_MAX_TOKENS:-1800}
      JUDGE_LLM_TIMEOUT_SECONDS: ${JUDGE_LLM_TIMEOUT_SECONDS:-120}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      JUDGE_LLM_PROVIDER: ${JUDGE_LLM_PROVIDER:-openai_compatible}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      JUDGE_ANTHROPIC_MODEL: ${JUDGE_ANTHROPIC_MODEL:-}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-16000}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-600}
      SEARXNG_PROXY_URL: ${SEARXNG_PROXY_URL:-}
      SEARXNG_PROXY_KEY: ${SEARXNG_PROXY_KEY:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_DAILY_TIME: ${SYNC_DAILY_TIME:-15:30,21:45}
      SYNC_MARKET_LOOKBACK_DAYS: ${SYNC_MARKET_LOOKBACK_DAYS:-520}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-500}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn quant_signal.adapters.rest.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "18100:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp:
    build: .
    environment: *app-env
    command: quant-signal-mcp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "18101:8001"

  worker:
    build: .
    environment: *app-env
    command: quant-signal-worker
    depends_on:
      api:
        condition: service_healthy

  seed:
    build: .
    environment: *app-env
    command: quant-signal-seed-demo
    profiles: ["demo"]
    depends_on:
      api:
        condition: service_healthy

  sync:
    build: .
    environment: *app-env
    command: >
      quant-signal-sync-data daily
      --symbols 2330.TW 6488.TWO
      --lookback-days 1000
    profiles: ["real-data"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_QUANT_API_URL: ${NEXT_PUBLIC_QUANT_API_URL:-http://127.0.0.1:18100}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "13000:3000"

volumes:
  quant_signal_pgdata:
  quote_redis_data:
