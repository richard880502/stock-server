services:
  quote-redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      stock-private:
        aliases: [stock-quote-redis]

  # The ingest service (the only writer of market data): official TWSE/TPEx sync
  # plus the Shioaji collector. The service keeps the name "quotes" so the existing
  # Coolify app does not need to be re-created.
  quotes:
    build:
      context: .
      dockerfile: deploy/quotes/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/livez', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 90s
      retries: 3
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      QUOTES_ENABLED: "true"
      QUOTES_REDIS_URL: redis://stock-quote-redis:6379/0
      QUOTES_MAX_SYMBOLS: ${QUOTES_MAX_SYMBOLS:-200}
      SHIOAJI_API_KEY: ${SHIOAJI_API_KEY:?required}
      SHIOAJI_SECRET_KEY: ${SHIOAJI_SECRET_KEY:?required}
      SHIOAJI_SIMULATION: ${SHIOAJI_SIMULATION:-false}
      QUOTES_BACKFILL_ENABLED: ${QUOTES_BACKFILL_ENABLED:-true}
      QUOTES_BACKFILL_AFTER_CLOSE: "${QUOTES_BACKFILL_AFTER_CLOSE:-14:45}"
      QUOTES_BACKFILL_INTRADAY_MAX: ${QUOTES_BACKFILL_INTRADAY_MAX:-150}
      QUOTES_BACKFILL_WHOLE_MARKET: ${QUOTES_BACKFILL_WHOLE_MARKET:-true}
      QUOTES_BACKFILL_MAX_SYMBOLS: ${QUOTES_BACKFILL_MAX_SYMBOLS:-2500}
      QUOTES_USAGE_RESERVE_MB: ${QUOTES_USAGE_RESERVE_MB:-100}
      QUOTES_SNAPSHOT_MINUTES: ${QUOTES_SNAPSHOT_MINUTES:-10}
      MINUTE_BARS_RETENTION_MONTHS: ${MINUTE_BARS_RETENTION_MONTHS:-0}
      # Official exchange sync moved here from the worker: one writer unit.
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      SYNC_DAILY_TIME: ${SYNC_DAILY_TIME:-15:30,21:45}
      SYNC_MARKET_LOOKBACK_DAYS: ${SYNC_MARKET_LOOKBACK_DAYS:-520}
      SYNC_LOOKBACK_DAYS: ${SYNC_LOOKBACK_DAYS:-500}
    depends_on:
      quote-redis:
        condition: service_healthy
    networks: [stock-private]

networks:
  stock-private:
    external: true
