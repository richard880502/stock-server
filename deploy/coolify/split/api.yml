services:
  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      KRONOS_URL: http://stock-kronos:8002
      KRONOS_API_KEY: ${KRONOS_API_KEY:-}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_TRANSPORT: streamable-http
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:13000,http://127.0.0.1:13000}
      API_AUTH_ENABLED: ${API_AUTH_ENABLED:-true}
      QUOTES_ENABLED: ${QUOTES_ENABLED:-false}
      QUOTES_REDIS_URL: ${QUOTES_REDIS_URL:-redis://stock-quote-redis:6379/0}
      QUOTES_MAX_SYMBOLS: ${QUOTES_MAX_SYMBOLS:-200}
      QUOTES_MAX_CONNECTIONS_PER_USER: ${QUOTES_MAX_CONNECTIONS_PER_USER:-5}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_API_KEY: ${LLM_API_KEY:-local}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1800}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      JUDGE_LLM_ENABLED: ${JUDGE_LLM_ENABLED:-false}
      JUDGE_LLM_BASE_URL: ${JUDGE_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      JUDGE_LLM_MODEL: ${JUDGE_LLM_MODEL:-}
      JUDGE_LLM_API_KEY: ${JUDGE_LLM_API_KEY:-local}
      JUDGE_LLM_TEMPERATURE: ${JUDGE_LLM_TEMPERATURE:-0.2}
      JUDGE_LLM_MAX_TOKENS: ${JUDGE_LLM_MAX_TOKENS:-1800}
      JUDGE_LLM_TIMEOUT_SECONDS: ${JUDGE_LLM_TIMEOUT_SECONDS:-120}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      JUDGE_LLM_PROVIDER: ${JUDGE_LLM_PROVIDER:-openai_compatible}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      JUDGE_ANTHROPIC_MODEL: ${JUDGE_ANTHROPIC_MODEL:-}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-16000}
      ANTHROPIC_TIMEOUT_SECONDS: ${ANTHROPIC_TIMEOUT_SECONDS:-600}
      SEARXNG_PROXY_URL: ${SEARXNG_PROXY_URL:-}
      SEARXNG_PROXY_KEY: ${SEARXNG_PROXY_KEY:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-}
    command: "sh -c \"alembic upgrade head &&\n       uvicorn quant_signal.adapters.rest.main:app\
      \ --host 0.0.0.0 --port 8000\"\n"
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      stock-private:
        aliases:
        - stock-api
networks:
  stock-private:
    external: true
